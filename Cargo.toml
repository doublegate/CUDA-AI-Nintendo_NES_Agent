[package]
name = "cuda_ai_nintendo_nes_agent"
version = "0.1.0"
edition = "2021"
authors = ["doublegate"]
description = "CUDA-accelerated AI agent for Nintendo NES emulation and gameplay"
readme = "README.md"
license = "MIT"

[dependencies]
# Core dependencies
sdl2 = "0.38"
cuda-sys = "0.2"
ndarray = "0.17"
ndarray-rand = "0.16"
rand = "0.9"

# AI and ML dependencies
tch = "0.26"  # PyTorch bindings for Rust
tract-onnx = "0.23.9"

# NES Emulation dependencies
# These will interact with the rustyNES components
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
cc = "1.0"
bindgen = "0.73"

[dev-dependencies]
criterion = "0.8"

[lib]
name = "cuda_ai_nintendo_nes_agent"
path = "src/lib.rs"

[[bin]]
name = "cuda_ai_nintendo_nes_agent"
path = "src/main.rs"

[package]
name = "cuda_ai_nintendo_nes_agent"
version = "0.1.0"
edition = "2021"
authors = ["doublegate"]
description = "CUDA-accelerated AI agent for Nintendo NES emulation and gameplay"
readme = "README.md"
license = "MIT"

[dependencies]
# Core dependencies
sdl2 = "0.35.2"
cuda-sys = "0.2.0"
ndarray = "0.15.6"
ndarray-rand = "0.14.0"
rand = "0.8.5"

# AI and ML dependencies
tch = "0.13.0"  # PyTorch bindings for Rust
tract-onnx = "0.20.16"

# NES Emulation dependencies
# These will interact with the rustyNES components
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
cc = "1.0"
bindgen = "0.64.0"

[dev-dependencies]
criterion = "0.4"

[lib]
name = "cuda_ai_nintendo_nes_agent"
path = "src/lib.rs"

[[bin]]
name = "cuda_ai_nintendo_nes_agent"
path = "src/main.rs"
